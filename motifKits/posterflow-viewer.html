<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Posterflow Viewer</title>
<style>
:root{--bg:#0b0c10;--panel:#12141a;--panel2:#171a22;--line:#242833;--ink:#eef1f7;--dim:#8d94a6;--acc:#4d7cff;--acc2:#a8d2ff;--r:12px}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;grid-template-rows:auto 1fr;height:100%}
header{grid-column:1/-1;display:flex;gap:14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:14px;margin:0;font-weight:650;letter-spacing:.02em}h1 small{color:var(--dim);font-weight:500;margin-left:6px}
.grp{display:flex;gap:6px;align-items:center}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#3a4052}.btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chips{display:flex;gap:6px}.chip{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;background:conic-gradient(var(--c1),var(--c2),var(--c3),var(--c1))}
.chip.on{border-color:#fff}
aside{border-right:1px solid var(--line);overflow:auto;padding:8px;background:var(--panel)}
aside.r{border-right:0;border-left:1px solid var(--line);padding:10px 12px}
.item{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px 10px;margin-bottom:4px;cursor:pointer}
.item:hover{background:var(--panel2)}.item.on{background:var(--panel2);border-color:var(--acc)}
.item b{display:block;font-weight:600}.item span{color:var(--dim);font-size:11px;display:block;margin-top:2px;line-height:1.3}
.item i{font-style:normal;font-size:10px;color:var(--acc2);float:right;opacity:.8}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px;position:relative}
canvas#view{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 20px 60px #0009;background:#000}
.hud{position:absolute;left:22px;bottom:22px;font-size:11px;color:#fffc;text-shadow:0 1px 3px #000;pointer-events:none}
.msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--dim)}
.bar{display:flex;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.bar input[type=range]{flex:1;min-width:120px}
label.f{display:flex;gap:6px;align-items:center;color:var(--dim)}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin:16px 0 8px;font-weight:600}h3:first-child{margin-top:0}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-bottom:9px}
.row label{color:var(--ink)}.row output{color:var(--dim);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1;width:100%}
.row.t{display:flex;justify-content:space-between;align-items:center}
.row select{grid-column:1/-1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px}
input[type=range]{accent-color:var(--acc)}
input[type=color]{width:100%;height:28px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:2px;grid-column:1/-1}
.bar select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.tip{color:var(--dim);font-size:11px;margin:-4px 0 8px}
@media (max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto;height:auto}
aside{border:0;display:flex;gap:6px;overflow-x:auto;padding:8px}aside.r{border-top:1px solid var(--line)}
.item{min-width:150px;margin:0}.item span{display:none}.stage{height:70vh;flex:none}}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>Posterflow<small id="ver"></small></h1>
  <div class="grp" id="srcs"></div>
  <div class="chips" id="pals"></div>
  <div class="grp" id="aspects"></div>
  <div class="grp" style="margin-left:auto"><button class="btn" id="rand">Randomize</button><button class="btn" id="reset">Reset</button><button class="btn" id="png">PNG</button><button class="btn" id="rec">Record loop</button></div>
</header>
<aside id="list"></aside>
<main>
  <div class="stage"><canvas id="view"></canvas><div class="hud" id="hud"></div><div class="msg" id="msg"></div></div>
  <div class="bar">
    <button class="btn" id="play">Pause</button>
    <input type="range" id="phase" min="0" max="1" step="0.001" value="0" aria-label="Loop phase">
    <label class="f">Loop <input type="range" id="loop" min="2" max="16" step="1" value="8" style="width:90px"><span id="loopv">8 s</span></label>
    <label class="f">Quality <select id="qual"><option value="1">Full</option><option value="0.7">Balanced</option><option value="0.5">Fast</option></select></label>
  </div>
</main>
<aside class="r" id="insp"></aside>
</div>
<input type="file" id="file" accept="image/*,video/*" hidden>

ms":{"scale":{"type":"range","label":"Flow scale","min":0.4,"max":4,"def":1,"step":0.01,"group":"Flow","log":true},"warp":{"type":"range","label":"Warp","min":0,"max":2.5,"def":0.9,"step":0.01,"group":"Flow"},"turns":{"type":"int","label":"Cycles / loop","min":1,"max":3,"def":1,"group":"Motion","hint":"Whole cycles per loop; the loop always closes."},"petals":{"type":"int","label":"Petals","min":2,"max":14,"def":6,"group":"Fold","randMax":10},"centre":{"type":"point","label":"Centre","min":-0.5,"max":0.5,"def":[0,0],"group":"Fold"},"pick":{"type":"point","label":"Source region","min":-0.5,"max":0.5,"def":[0.12,0.05],"group":"Fold","hint":"Which part of the image feeds the petals."},"spin":{"type":"range","label":"Spin","min":-3,"max":3,"def":0,"step":0.01,"group":"Fold"},"zoomIn":{"type":"range","label":"Bloom","min":-1,"max":1.5,"def":0.5,"step":0.01,"group":"Fold"},"seam":{"type":"range","label":"Seams","min":0,"max":1,"def":0.15,"step":0.01,"group":"Fold","hint":"Dark lines along the mirror folds."},"vignette":{"type":"range","label":"Vignette","min":0,"max":0.6,"def":0.3,"step":0.01,"group":"Lens","randMax":0.5},"exposure":{"type":"range","label":"Exposure","min":0.5,"max":1.6,"def":1,"step":0.01,"group":"Lens","mutate":0.2},"grain":{"type":"range","label":"Grain","min":0,"max":1,"def":0.25,"step":0.01,"group":"Lens","randMax":0.6}}},{"id":"aura-wash","name":"Aura Wash","group":"Posterflow","palette":"tidal","tags":["media","blur","bloom","gradient","soft"],"blurb":"An out-of-focus, drifting bloom of the source graded through the palette, with film grain.","cost":1.6,"flash":false,"passes":[{"src":"styles/aura-wash.glsl"}],"params":{"scale":{"type":"range","label":"Flow scale","min":0.4,"max":4,"def":0.9,"step":0.01,"group":"Flow","log":true},"warp":{"type":"range","label":"Warp","min":0,"max":2.5,"def":1,"step":0.01,"group":"Flow"},"turns":{"type":"int","label":"Cycles / loop","min":1,"max":3,"def":1,"group":"Motion","hint":"Whole cycles per loop; the loop always closes."},"blur":{"type":"range","label":"Blur","min":0.01,"max":0.4,"def":0.12,"step":0.01,"group":"Soft","log":true},"palMix":{"type":"range","label":"Palette grade","min":0,"max":1,"def":0.35,"step":0.01,"group":"Soft"},"chroma":{"type":"range","label":"Colour","min":0,"max":1.6,"def":1.2,"step":0.01,"group":"Soft"},"glow":{"type":"range","label":"Glow","min":0,"max":2,"def":0.7,"step":0.01,"group":"Soft"},"vignette":{"type":"range","label":"Vignette","min":0,"max":0.6,"def":0.35,"step":0.01,"group":"Lens","randMax":0.5},"exposure":{"type":"range","label":"Exposure","min":0.5,"max":1.6,"def":1,"step":0.01,"group":"Lens","mutate":0.2},"grain":{"type":"range","label":"Grain","min":0,"max":1,"def":0.55,"step":0.01,"group":"Lens","randMax":0.6}}}],"effects":[{"id":"poster-wash","name":"Poster Wash","target":"any","group":"Posterflow","cost":0.8,"tags":["posterize","veins"],"blurb":"Bands and vein-lines any layer or the whole frame, with an optional liquid warp.","inputs":[],"passes":[{"src":"effects/poster-wash.glsl"}],"params":{"scale":{"type":"range","label":"Flow scale","min":0.4,"max":4,"def":1.4,"step":0.01,"group":"Flow","log":true},"warp":{"type":"range","label":"Warp","min":0,"max":2.5,"def":0.5,"step":0.01,"group":"Flow"},"turns":{"type":"int","label":"Cycles / loop","min":1,"max":3,"def":1,"group":"Motion","hint":"Whole cycles per loop; the loop always closes."},"bands":{"type":"int","label":"Bands","min":2,"max":16,"def":7,"group":"Poster","randMax":10,"hint":"Number of tonal steps."},"soft":{"type":"range","label":"Edge softness","min":0,"max":1,"def":0.2,"step":0.01,"group":"Poster","hint":"0 is a hard posterize edge."},"hue":{"type":"range","label":"Hue steps","min":0,"max":1,"def":0.35,"step":0.01,"group":"Poster","hint":"Quantize each colour channel as well as brightness."},"mode":{"type":"select","label":"Colour","options":[{"v":"source","l":"Source"},{"v":"pal","l":"Palette ramp"},{"v":"mix","l":"Mix"}],"def":"source","mutate":0,"group":"Poster"},"palMix":{"type":"range","label":"Palette mix","min":0,"max":1,"def":0.5,"step":0.01,"group":"Poster","show":{"param":"mode","is":"mix"}},"veins":{"type":"range","label":"Veins","min":0,"max":1,"def":0.4,"step":0.01,"group":"Poster","hint":"Thin dark lines along band edges."},"veinW":{"type":"range","label":"Vein width","min":0.5,"max":4,"def":1.1,"step":0.01,"group":"Poster","unit":"px","log":true},"vein":{"type":"color","label":"Vein colour","def":"#06070C","group":"Poster"}}}],"transitions":[{"id":"liquid-cut","name":"Liquid Cut","duration":1.4,"group":"Posterflow","cost":0.8,"tags":["ink","wipe"],"blurb":"An ink front sweeps from one shot to the next while both flow; exact at both ends.","inputs":[],"passes":[{"src":"transitions/liquid-cut.glsl"}],"params":{"scale":{"type":"range","label":"Scale","min":0.5,"max":4,"def":1.6,"step":0.01,"log":true},"warp":{"type":"range","label":"Warp","min":0,"max":2.5,"def":1.2,"step":0.01},"soft":{"type":"range","label":"Edge softness","min":0.02,"max":0.4,"def":0.14,"step":0.01},"rim":{"type":"range","label":"Rim light","min":0,"max":2,"def":0.6,"step":0.01}}}],"sequences":[{"id":"poster-reel","file":"sequences/poster-reel.json"},{"id":"soft-reel","file":"sequences/soft-reel.json"}],"exporters":[{"id":"reel-vertical","name":"Reel 9:16","blurb":"Vertical 1080p MP4, three loops.","preset":{"format":"mp4","aspect":"9x16","tier":1080,"fps":30,"loops":3,"quality":"high"}},{"id":"master-square","name":"Square master","blurb":"1:1 1080p WebM.","preset":{"format":"webm","aspect":"1x1","tier":1080,"fps":30,"loops":1,"quality":"high"}}]},"files":{"README.md":"# Posterflow 2.0.0 (`motif-kit@4`)\n\nTwelve liquid poster looks for your own images and clips, built from the reel reference (soft marbles, banded poster ink, streak melts, iridescent halos, mosaic water) and extended in the same direction. Each style takes one media input (`Source`); with nothing attached, a palette ink marble plays so thumbnails are never blank. No style flashes. Every motion is whole `Cycles / loop`, so loops close exactly.\n\n| Style | Look | Cost |\n| --- | --- | --- |\n| Marble Flow | Looping flow-warp through colour bands and veins | 1 |\n| Streak Melt | Masked directional drag, RGB split, sheared slabs | 1.6 |\n| Ink Drag | Source carried along curl streamlines, then banded | 2.4 |\n| Thin Film | Iridescent halos on every brightness edge | 1.8 |\n| Mosaic Tide | Block-sampled, dithered colour stairs | 1 |\n| Gill Lines | Engraved contour, parallel or radial lines; shadows thicken | 1.2 |\n| Satin Pour | Refracted image lit with a stretched silk sheen | 2.2 |\n| Dot Screen | Halftone carried by liquid flow | 1.2 |\n| Tide Glint | Ripples + four-way glints on highlights | 2.6 |\n| Oil Wash | Kuwahara painter, brush-like colour fields | 3 |\n| Petal Fold | Mirror-folded petals poured through the flow | 1.2 |\n| Aura Wash | Out-of-focus drifting bloom graded through the palette | 1.6 |\n\nAlso: **Poster Wash** (layer/finish effect), **Liquid Cut** (transition, exact at 0 and 1), sequences **Poster Reel** and **Soft Reel** (12 s, at most two shaders at once), four palettes (Tidal, Ember, Rosewater, Mineral) and two export presets.\n\nShared Lens controls on every style: Vignette, Exposure, Grain. Costs are declared estimates; on real GPUs Oil Wash, Tide Glint and Ink Drag are the heavy ones (reduce Brush radius / Smear taps / Steps first).\n\nLimits: no state across frames, so flows are procedural rather than simulated.\n\nSource layout: `styles/` for the three first styles are hand-written; the other nine are generated by `motifKits/tools/posterflow/build.mjs` from `body/*.glsl` + `head.glsl`, which also writes `manifest.json` and the sequences. Edit there, then run `node build.mjs`.\n","common.glsl":"// Posterflow shared helpers (pf_ prefix). Compiled into every pass of every entry.\n// Field class: all warps here are plain displacement fields (no distance semantics, no marching).\n\n#define PF_SRC 0\n#define PF_PAL 1\n#define PF_MIX 2\n\n// Two-level looping domain warp. k = whole cycles per loop. Returns a displacement in uv units (about -1.5..1.5).\nvec2 pf_flow(vec2 p, float k) {\n  vec2 a = vec2(ln2(p, k, 0.55), ln2(p + 17.3, k, 0.55));\n  vec2 b = vec2(ln2(p * 2.1 + a * 1.3 + 5.1, k, 0.5), ln2(p * 2.1 + a * 1.3 + 31.7, k, 0.5));\n  return a + 0.5 * b;\n}\n\n// Single-level flow for streamline integration (cheap).\nvec2 pf_flow1(vec2 p, float k) { return vec2(ln2(p, k, 0.5), ln2(p + 17.3, k, 0.5)); }\n\n// Staircase with soft shoulders: n bands, soft 0..1 (0 = hard). Anti-aliased by the screen derivative.\n// Returns the banded value in 0..1 and the distance (in pixels) to the nearest band edge via `edge`.\nfloat pf_band(float x, float n, float soft, out float edge) {\n  float y = clamp(x, 0.0, 1.0) * n;\n  float fw = max(fwidth(y), 1e-4);\n  float s = clamp(max(soft * 0.5, fw * 0.75), 0.002, 0.5);\n  float f = fract(y);\n  edge = abs(f - 0.5) / fw;\n  return (floor(y) + smoothstep(0.5 - s, 0.5 + s, f)) / n;\n}\n\n// The poster treatment. c is premultiplied-free linear RGB. Returns linear RGB.\n//   n      band count          soft   shoulder softness (0 hard)\n//   hue    0 = luma bands only, 1 = per-channel bands (hue steps)\n//   mode   PF_SRC source colours, PF_PAL palette ramp, PF_MIX blend of both\n//   vein   vein line strength, veinW vein width in pixels, veinC vein colour (linear)\nvec3 pf_poster(vec3 c, float n, float soft, float hue, int mode, float pal, float vein, float veinW, vec3 veinC) {\n  c = max(c, 0.0);\n  float L = sqrt(max(luma(c), 0.0));\n  float e;\n  float Lq = pf_band(L, n, soft, e);\n  float ec;\n  vec3 s3 = sqrt(c);\n  vec3 cq = vec3(pf_band(s3.r, n, soft, ec), pf_band(s3.g, n, soft, ec), pf_band(s3.b, n, soft, ec));\n  vec3 keep = c * ((Lq * Lq) / max(L * L, 0.015));              // keep hue, snap luminance\n  vec3 src = mix(keep, cq * cq, hue);\n  vec3 rp = ramp(Lq);\n  vec3 col = mode == PF_SRC ? src : mode == PF_PAL ? rp : mix(src, rp, pal);\n  float v = 1.0 - smoothstep(veinW * 0.5, veinW * 0.5 + 1.2, e);\n  return mix(col, veinC, v * vein);\n}\n\n// Edge-preserving sweep used for smears: weights fall off along the sweep.\nfloat pf_tw(float i, float n) { float t = i / max(n, 1.0); return 1.0 - t * t; }\n\nvec3 pf_vignette(vec3 c, vec2 uv, float amt) { return c * (1.0 - amt * smoothstep(0.2, 0.95, length(uv))); }\n\n// Cosine rainbow (thin-film iridescence), returned as approximately linear RGB.\nvec3 pf_spectrum(float t) { vec3 c = 0.5 + 0.5 * cos(TAU * (t + vec3(0.0, 0.33, 0.67))); return c * c; }\n\n// Shared finish: vignette, exposure, static film grain (loop-safe: no time).\nvec3 pf_finish(vec3 c, vec2 uv, vec2 fc, float vig, float expo, float grain) {\n  c = pf_vignette(c, uv, vig) * expo;\n  return c + (h21(fc) - 0.5) * grain * 0.05;\n}\n","effects/poster-wash.glsl":"// Poster Wash: the same band + vein treatment for any layer or the finished frame. Keeps the input alpha.\nvec4 motif(vec2 uv, vec2 fc) {\n  vec2 q = fc / u_res;\n  vec2 asp = M_asp();\n  float k = safeCycles(float(p_turns));\n  vec2 d = pf_flow(uv * p_scale, k) * p_warp * 0.08 / asp;\n  vec4 s = g_inputAt(q + d);\n  vec3 rgb = s.a > 0.001 ? s.rgb / s.a : vec3(0.0);\n  vec3 col = pf_poster(rgb, float(p_bands), p_soft, p_hue, p_mode, p_palMix, p_veins, p_veinW, c_vein());\n  return vec4(col * s.a, s.a);\n}\n","manifest.json":"{\n  \"format\": \"motif-kit@4\",\n  \"id\": \"posterflow\",\n  \"name\": \"Posterflow\",\n  \"version\": \"2.0.0\",\n  \"author\": \"Motif\",\n  \"description\": \"Twelve liquid poster looks for your own images and clips: banded marbles, streak melts, ink drags, iridescent film, mosaic water, engraved gills, satin, halftone, glinting tides, oil paint, petal folds and soft auras. Plus a layer effect and a liquid cut transition.\",\n  \"license\": \"MIT\",\n  \"accent\": \"#4D7CFF\",\n  \"common\": \"common.glsl\",\n  \"capabilities\": [\n    \"media\"\n  ],\n  \"palettes\": [\n    {\n      \"id\": \"tidal\",\n ow scale\",\n          \"min\": 0.4,\n          \"max\": 4,\n          \"def\": 0.9,\n          \"step\": 0.01,\n          \"group\": \"Flow\",\n          \"log\": true\n        },\n        \"warp\": {\n          \"type\": \"range\",\n          \"label\": \"Warp\",\n          \"min\": 0,\n          \"max\": 2.5,\n          \"def\": 1,\n          \"step\": 0.01,\n          \"group\": \"Flow\"\n        },\n        \"turns\": {\n          \"type\": \"int\",\n          \"label\": \"Cycles / loop\",\n          \"min\": 1,\n          \"max\": 3,\n          \"def\": 1,\n          \"group\": \"Motion\",\n          \"hint\": \"Whole cycles per loop; the loop always closes.\"\n        },\n        \"blur\": {\n          \"type\": \"range\",\n          \"label\": \"Blur\",\n          \"min\": 0.01,\n          \"max\": 0.4,\n          \"def\": 0.12,\n          \"step\": 0.01,\n          \"group\": \"Soft\",\n          \"log\": true\n        },\n        \"palMix\": {\n          \"type\": \"range\",\n          \"label\": \"Palette grade\",\n          \"min\": 0,\n          \"max\": 1,\n          \"def\": 0.35,\n          \"step\": 0.01,\n          \"group\": \"Soft\"\n        },\n        \"chroma\": {\n          \"type\": \"range\",\n          \"label\": \"Colour\",\n          \"min\": 0,\n          \"max\": 1.6,\n          \"def\": 1.2,\n          \"step\": 0.01,\n          \"group\": \"Soft\"\n        },\n        \"glow\": {\n          \"type\": \"range\",\n          \"label\": \"Glow\",\n          \"min\": 0,\n          \"max\": 2,\n          \"def\": 0.7,\n          \"step\": 0.01,\n          \"group\": \"Soft\"\n        },\n        \"vignette\": {\n          \"type\": \"range\",\n          \"label\": \"Vignette\",\n          \"min\": 0,\n          \"max\": 0.6,\n          \"def\": 0.35,\n          \"step\": 0.01,\n          \"group\": \"Lens\",\n          \"randMax\": 0.5\n        },\n        \"exposure\": {\n          \"type\": \"range\",\n          \"label\": \"Exposure\",\n          \"min\": 0.5,\n          \"max\": 1.6,\n          \"def\": 1,\n          \"step\": 0.01,\n          \"group\": \"Lens\",\n          \"mutate\": 0.2\n        },\n        \"grain\": {\n          \"type\": \"range\",\n          \"label\": \"Grain\",\n          \"min\": 0,\n          \"max\": 1,\n          \"def\": 0.55,\n          \"step\": 0.01,\n          \"group\": \"Lens\",\n          \"randMax\": 0.6\n        }\n      }\n    }\n  ],\n  \"effects\": [\n    {\n      \"id\": \"poster-wash\",\n      \"name\": \"Poster Wash\",\n      \"target\": \"any\",\n      \"group\": \"Posterflow\",\n      \"cost\": 0.8,\n      \"tags\": [\n        \"posterize\",\n        \"veins\"\n      ],\n      \"blurb\": \"Bands and vein-lines any layer or the whole frame, with an optional liquid warp.\",\n      \"inputs\": [],\n      \"passes\": [\n        {\n          \"src\": \"effects/poster-wash.glsl\"\n        }\n      ],\n      \"params\": {\n        \"scale\": {\n          \"type\": \"range\",\n          \"label\": \"Flow scale\",\n          \"min\": 0.4,\n          \"max\": 4,\n          \"def\": 1.4,\n          \"step\": 0.01,\n          \"group\": \"Flow\",\n          \"log\": true\n        },\n        \"warp\": {\n          \"type\": \"range\",\n          \"label\": \"Warp\",\n          \"min\": 0,\n          \"max\": 2.5,\n          \"def\": 0.5,\n          \"step\": 0.01,\n          \"group\": \"Flow\"\n        },\n        \"turns\": {\n          \"type\": \"int\",\n          \"label\": \"Cycles / loop\",\n          \"min\": 1,\n          \"max\": 3,\n          \"def\": 1,\n          \"group\": \"Motion\",\n          \"hint\": \"Whole cycles per loop; the loop always closes.\"\n        },\n        \"bands\": {\n          \"type\": \"int\",\n          \"label\": \"Bands\",\n          \"min\": 2,\n          \"max\": 16,\n          \"def\": 7,\n          \"group\": \"Poster\",\n          \"randMax\": 10,\n          \"hint\": \"Number of tonal steps.\"\n        },\n        \"soft\": {\n          \"type\": \"range\",\n          \"label\": \"Edge softness\",\n          \"min\": 0,\n          \"max\": 1,\n          \"def\": 0.2,\n          \"step\": 0.01,\n          \"group\": \"Poster\",\n          \"hint\": \"0 is a hard posterize edge.\"\n        },\n        \"hue\": {\n          \"type\": \"range\",\n          \"label\": \"Hue steps\",\n          \"min\": 0,\n          \"max\": 1,\n          \"def\": 0.35,\n          \"step\": 0.01,\n          \"group\": \"Poster\",\n          \"hint\": \"Quantize each colour channel as well as brightness.\"\n        },\n        \"mode\": {\n          \"type\": \"select\",\n          \"label\": \"Colour\",\n          \"options\": [\n            {\n              \"v\": \"source\",\n              \"l\": \"Source\"\n            },\n            {\n              \"v\": \"pal\",\n              \"l\": \"Palette ramp\"\n            },\n            {\n              \"v\": \"mix\",\n              \"l\": \"Mix\"\n            }\n          ],\n          \"def\": \"source\",\n          \"mutate\": 0,\n          \"group\": \"Poster\"\n        },\n        \"palMix\": {\n          \"type\": \"range\",\n          \"label\": \"Palette mix\",\n          \"min\": 0,\n          \"max\": 1,\n          \"def\": 0.5,\n          \"step\": 0.01,\n          \"group\": \"Poster\",\n          \"show\": {\n            \"param\": \"mode\",\n            \"is\": \"mix\"\n          }\n        },\n        \"veins\": {\n          \"type\": \"range\",\n          \"label\": \"Veins\",\n          \"min\": 0,\n          \"max\": 1,\n          \"def\": 0.4,\n          \"step\": 0.01,\n          \"group\": \"Poster\",\n          \"hint\": \"Thin dark lines along band edges.\"\n        },\n        \"veinW\": {\n          \"type\": \"range\",\n          \"label\": \"Vein width\",\n          \"min\": 0.5,\n          \"max\": 4,\n          \"def\": 1.1,\n          \"step\": 0.01,\n          \"group\": \"Poster\",\n          \"unit\": \"px\",\n          \"log\": true\n        },\n        \"vein\": {\n          \"type\": \"color\",\n          \"label\": \"Vein colour\",\n          \"def\": \"#06070C\",\n          \"group\": \"Poster\"\n        }\n      }\n    }\n  ],\n  \"transitions\": [\n    {\n      \"id\": \"liquid-cut\",\n      \"name\": \"Liquid Cut\",\n      \"duration\": 1.4,\n      \"group\": \"Posterflow\",\n      \"cost\": 0.8,\n      \"tags\": [\n        \"ink\",\n        \"wipe\"\n      ],\n      \"blurb\": \"An ink front sweeps from one shot to the next while both flow; exact at both ends.\",\n      \"inputs\": [],\n      \"passes\": [\n        {\n          \"src\": \"transitions/liquid-cut.glsl\"\n        }\n      ],\n      \"params\": {\n        \"scale\": {\n          \"type\": \"range\",\n          \"label\": \"Scale\",\n          \"min\": 0.5,\n          \"max\": 4,\n          \"def\": 1.6,\n          \"step\": 0.01,\n          \"log\": true\n        },\n        \"warp\": {\n          \"type\": \"range\",\n          \"label\": \"Warp\",\n          \"min\": 0,\n          \"max\": 2.5,\n          \"def\": 1.2,\n          \"step\": 0.01\n        },\n        \"soft\": {\n          \"type\": \"range\",\n          \"label\": \"Edge softness\",\n          \"min\": 0.02,\n          \"max\": 0.4,\n          \"def\": 0.14,\n          \"step\": 0.01\n        },\n        \"rim\": {\n          \"type\": \"range\",\n          \"label\": \"Rim light\",\n          \"min\": 0,\n          \"max\": 2,\n          \"def\": 0.6,\n          \"step\": 0.01\n        }\n      }\n    }\n  ],\n  \"sequences\": [\n    {\n      \"id\": \"poster-reel\",\n      \"file\": \"sequences/poster-reel.json\"\n    },\n    {\n      \"id\": \"soft-reel\",\n      \"file\": \"sequences/soft-reel.json\"\n    }\n  ],\n  \"exporters\": [\n    {\n      \"id\": \"reel-vertical\",\n      \"name\": \"Reel 9:16\",\n      \"blurb\": \"Vertical 1080p MP4, three loops.\",\n      \"preset\": {\n        \"format\": \"mp4\",\n        \"aspect\": \"9x16\",\n        \"tier\": 1080,\n        \"fps\": 30,\n        \"loops\": 3,\n        \"quality\": \"high\"\n      }\n    },\n    {\n      \"id\": \"master-square\",\n      \"name\": \"Square master\",\n      \"blurb\": \"1:1 1080p WebM.\",\n      \"preset\": {\n        \"format\": \"webm\",\n        \"aspect\": \"1x1\",\n        \"tier\": 1080,\n        \"fps\": 30,\n        \"loops\": 1,\n        \"quality\": \"high\"\n      }\n    }\n  ]\n}\n","sequences/poster-reel.json":"{\n  \"format\": \"motif-seq@1\",\n  \"id\": \"poster-reel\",\n  \"name\": \"Poster Reel\",\n  \"description\": \"Twelve seconds: a marble bed with streaks, drags, film and engraving crossing over it. Never more than two shaders at once.\",\n  \"loop\": 12,\n  \"bpm\": 90,\n  \"seed\": 11,\n  \"maxActive\": 2,\n  \"cues\": [\n    {\n      \"id\": \"bed\",\n      \"style\": \"marble-flow\",\n      \"at\": 0,\n      \"len\": \"1\",\n      \"lane\": 0,\n      \"cycles\": 1,\n      \"fadeIn\": 0,\n      \"fadeOut\": 0\n    },\n    {\n      \"id\": \"melt\",\n      \"style\": \"streak-melt\",\n      \"at\": \"2s\",\n      \"len\": \"3s\",\n      \"lane\": 1,\n      \"cycles\": 1,\n      \"fadeIn\": 0.25,\n      \"fadeOut\": 0.25\n    },\n    {\n      \"id\": \"film\",\n      \"style\": \"thin-film\",\n      \"at\": \"5.5s\",\n      \"len\": \"3s\",\n      \"lane\": 1,\n      \"cycles\": 1,\n      \"fadeIn\": 0.25,\n      \"fadeOut\": 0.25\n    },\n    {\n      \"id\": \"drag\",\n      \"style\": \"ink-drag\",\n      \"at\": \"9s\",\n      \"len\": \"3s\",\n      \"lane\": 1,\n      \"cycles\": 1,\n      \"fadeIn\": 0.25,\n      \"fadeOut\": 0.25\n    }\n  ]\n}\n","sequences/soft-reel.json":"{\n  \"format\": \"motif-seq@1\",\n  \"id\": \"soft-reel\",\n  \"name\": \"Soft Reel\",\n  \"description\": \"A calmer twelve seconds: aura bed, satin and petal fold, oil wash and glints.\",\n  \"loop\": 12,\n  \"bpm\": 70,\n  \"seed\": 5,\n  \"maxActive\": 2,\n  \"cues\": [\n    {\n      \"id\": \"bed\",\n      \"style\": \"aura-wash\",\n      \"at\": 0,\n      \"len\": \"1\",\n      \"lane\": 0,\n      \"cycles\": 1,\n      \"fadeIn\": 0,\n      \"fadeOut\": 0\n    },\n    {\n      \"id\": \"satin\",\n      \"style\": \"satin-pour\",\n      \"at\": \"1s\",\n      \"len\": \"4s\",\n      \"lane\": 1,\n      \"cycles\": 1,\n      \"fadeIn\": 0.25,\n      \"fadeOut\": 0.25,\n      \"opacity\": 0.9\n    },\n    {\n      \"id\": \"petal\",\n      \"style\": \"petal-fold\",\n      \"at\": \"5s\",\n      \"len\": \"3.5s\",\n      \"lane\": 1,\n      \"cycles\": 1,\n      \"fadeIn\": 0.25,\n      \"fadeOut\": 0.25\n    },\n    {\n      \"id\": \"glint\",\n      \"style\": \"tide-glint\",\n      \"at\": \"8.5s\",\n      \"len\": \"3.5s\",\n      \"lane\": 1,\n      \"cycles\": 1,\n      \"fadeIn\": 0.25,\n      \"fadeOut\": 0.25,\n      \"blend\": \"screen\"\n    }\n  ]\n}\n","styles/aura-wash.glsl":"// Source colour at frame-normalised q, or the palette ink marble when no media is attached (thumbnails never blank).\nvec3 sx(vec2 q) {\n  if (u_sourceOn > 0.5) { vec4 s = m_source(q); return s.rgb + u_bg * (1.0 - s.a); }\n  vec2 uv = (q - 0.5) * M_asp();\n  return ramp(0.5 + 0.5 * lfbm(uv * 1.5, 3, safeCycles(float(p_turns)), 0.5));\n}\n\n// Aura Wash: an out-of-focus, flow-drifted bloom of the source, graded through the palette with film grain.\n// The soft colour fields that sit behind the sharper looks.\nvec4 motif(vec2 uv, vec2 fc) {\n  vec2 q = fc / u_res, asp = M_asp();\n  float k = safeCycles(float(p_turns));\n  vec2 w = pf_flow(uv * p_scale, k);\n  vec2 qq = q + w * p_warp * 0.1 / asp;\n  vec3 acc = vec3(0.0); float ws = 0.0;\n  for (int i = 0; i < 24; i++) {\n    float t = (float(i) + 0.5) / 24.0;\n    float a = float(i) * 2.399963 + h21(fc) * TAU;\n    vec2 o = sqrt(t) * vec2(cos(a), sin(a)) * p_blur / asp;\n    float wt = 1.0 - 0.5 * t;\n    acc += sx(qq + o) * wt; ws += wt;\n  }\n  vec3 c = acc / ws;\n  float L = sqrt(max(luma(c), 0.0));\n  vec3 graded = mix(c, ramp(L), p_palMix);\n  graded += (u_a1 + 0.25 * u_ink) * pow(max(L - 0.3, 0.0) * 1.43, 1.5) * p_glow * 0.9;\n  vec3 col = mix(vec3(luma(graded)), graded, p_chroma);\n  col = pf_finish(col, uv, fc, p_vignette, p_exposure, p_grain);\n  return vec4(max(col, 0.0), 1.0);\n}\n","styles/dot-screen.glsl":"// Source colour at frame-normalised q, or the palette ink marble when no media is attached (thumbnails never blank).\nvec3 sx(vec2 q) {\n  if (u_sourceOn > 0.5) { vec4 s = m_source(q); return s.rgb + u_bg * (1.0 - s.a); }\n  vec2 uv = (q - 0.5) * M_asp();\n  return ramp(0.5 + 0.5 * lfbm(uv * 1.5, 3, safeCycles(float(p_turns)), 0.5));\n}\n\n// Dot Screen: a halftone whose grid is carried by the liquid flow. Dot size follows tone; colour comes from the\n// source at each dot's centre (or the palette).\nvec4 motif(vec2 uv, vec2 fc) {\n  vec2 q = fc / u_res, asp = M_asp();\n  float k = safeCycles(float(p_turns));\n  vec2 w = pf_flow(uv * p_scale, k);\n  vec2 gp = rot(radians(p_angle)) * (uv + w * p_warp * 0.06);\n  float cells = float(p_cells);\n  vec2 id = floor(gp * cells), f = fract(gp * cells) - 0.5;\n  vec2 cuv = transpose(rot(radians(p_angle))) * ((id + 0.5) / cells);\n  vec3 c = sx(cuv / asp + 0.5);\n  float L = sqrt(max(luma(c), 0.0));\n  float r = mix(0.5, 0.0, L) * p_size + 0.04 * p_size;                // dark = big dot\n  r = p_flip ? mix(0.0, 0.5, L) * p_size : r;\n  float d = length(f) - r;\n  float aaw = max(fwidth(d), 1e-4);\n  float dot_ = 1.0 - smoothstep(-aaw, aaw, d);\n  vec3 ink = mix(c * 1.3, ramp(L), p_palMix);\n  vec3 col = mix(u_bg, ink, dot_);\n  col = pf_finish(col, uv, fc, p_vignette, p_exposure, p_grain);\n  return vec4(max(col, 0.0), 1.0);\n}\n","styles/gill-lines.glsl":"// Source colour at frame-normalised q, or the palette ink marble when no media is attached (thumbnails never blank).\nvec3 sx(vec2 q) {\n  if (u_sourceOn > 0.5) { vec4 s = m_source(q); return s.rgb + u_bg * (1.0 - s.a); }\n  vec2 uv = (q - 0.5) * M_asp();\n  return ramp(0.5 + 0.5 * lfbm(uv * 1.5, 3, safeCycles(float(p_turns)), 0.5));\n}\n\n// Gill Lines: engraved iso-lines of the warped source brightness, in contour, parallel or radial patterns. Line weight\n// follows tone, so shadows thicken like a petal's gills.\nvec4 motif(vec2 uv, vec2 fc) {\n  vec2 q = fc / u_res, asp = M_asp();\n  float k = safeCycles(float(p_turns));\n  vec2 w = pf_flow(uv * p_scale, k);\n  vec2 qq = q + w * p_warp * 0.07 / asp;\n  vec3 c = sx(qq);\n  float L = sqrt(max(luma(c), 0.0));\n  float a = radians(p_angle);\n  float base;\n  if (p_pattern == PATTERN_CONTOUR) base = 0.0;\n  else if (p_pattern == PATTERN_PARALLEL) base = dot(uv, vec2(cos(a), sin(a))) * p_lines;\n  else base = atan(uv.y, uv.x) / TAU * floor(p_lines * 2.0 + 0.5) * 1.0;\n  float phi = base + L * p_lines * (p_pattern == PATTERN_CONTOUR ? 1.0 : p_follow) + 0.5 * w.x * p_follow;\n  float f = fract(phi);\n  float fw = max(fwidth(phi), 1e-4);\n  float wd = mix(0.12, 0.7, 1.0 - L) * p_weight;\n  float line = 1.0 - smoothstep(wd * 0.5, wd * 0.5 + fw * 1.2, abs(f - 0.5));\n  vec3 ink = mix(c * 1.25, u_ink, p_inkMix);\n  vec3 col = mix(u_bg, ink, line);\n  col = mix(col, c, p_ghost);\n  col = pf_finish(col, uv, fc, p_vignette, p_exposure, p_grain);\n  return vec4(max(col, 0.0), 1.0);\n}\n","styles/ink-drag.glsl":"// Ink Drag: the source is carried along a looping curl field in `steps` short hops, so colour streams along streamlines\n// like ink drawn through water. Each hop recomputes the flow, so the loop closes exactly (flow is a function of u_p).\nvec4 motif(vec2 uv, vec2 fc) {\n  vec2 asp = M_asp();\n  float k = safeCycles(float(p_turns));\n  vec2 p = uv;\n  vec3 acc = vec3(0.0); float wsum = 0.0;\n  float eps = 0.01;\n  for (int i = 0; i < 14; i++) {\n    if (i >= p_steps) break;\n    vec2 pp = p * p_scale;\n    // curl of a scalar noise: perpendicular gradient gives incompressible, swirling flow.\n    float n1 = ln2(pp + vec2(eps, 0.0), k, 0.5), n2 = ln2(pp - vec2(eps, 0.0), k, 0.5);\n    float n3 = ln2(pp + vec2(0.0, eps), k, 0.5), n4 = ln2(pp - vec2(0.0, eps), k, 0.5);\n    vec2 curl = vec2(n3 - n4, -(n1 - n2)) / (2.0 * eps);\n    p += normalize(curl + 1e-4) * min(length(curl), 3.0) * p_drag * 0.012;\n    float wt = 1.0 - 0.6 * float(i) / float(max(p_steps, 1));\n    vec4 s = m_source(p / asp + 0.5);\n    vec3 fb = ramp(0.5 + 0.5 * lfbm(p * 1.5, 3, k, 0.5));\n    acc += mix(fb, s.rgb + u_bg * (1.0 - s.a), u_sourceOn) * wt; wsum += wt;\n  }\n  vec3 col = acc / max(wsum, 1e-3);\n  col = pf_poster(col, float(p_bands), p_soft, p_hue, p_mode, p_palMix, p_veins, p_veinW, c_vein());\n  col = pf_finish(col, uv, fc, p_vignette, p_exposure, p_grain);\n  return vec4(max(col, 0.0), 1.0);\n}\n","styles/marble-flow.glsl":"// Marble Flow: a looping domain-warp pours the source (or a procedural ink field) through quantized colour bands,\n// with thin dark veins on the band edges. Fallback with no media: a palette ink marble, so thumbnails are never blank.\nvec4 motif(vec2 uv, vec2 fc) {\n  vec2 q = fc / u_res;\n  vec2 asp = M_asp();\n  float k = safeCycles(float(p_turns));\n  vec2 drift = p_drift * lc(k, 0.0);\n  vec2 w = pf_flow(uv * p_scale + drift, k);\n  // A slow vortex on top gives the pour a centre of mass (rotates by whole turns, so it loops).\n  float r = length(uv);\n  vec2 sw = rot(p_swirl * 2.2 * exp(-r * r * 3.0) * lsin(k, 0.0)) * uv - uv;\n  vec2 d = (w * p_warp * 0.16 + sw) / asp;\n\n  vec3 fallback;\n  {\n    float f = 0.5 + 0.5 * lfbm(uv * 1.6 + w * 0.9, 3, k, 0.5);\n    fallback = ramp(f * 1.05 - 0.02);\n  }\n  vec4 s = m_source(q + d);\n  vec3 col = mix(fallback, s.rgb + u_bg * (1.0 - s.a), u_sourceOn);\n\n  float soft = p_soft;\n  col = pf_poster(col, float(p_bands), soft, p_hue, p_mode, p_palMix, p_veins, p_veinW, c_vein());\n  col = pf_finish(col, uv, fc, p_vignette, p_exposure, p_grain);\n  return vec4(max(col, 0.0), 1.0);\n}\n","styles/mosaic-tide.glsl":"// Source colour at frame-normalised q, or the palette ink marble when no media is attached (thumbnails never blank).\nvec3 sx(vec2 q) {\n  if (u_sourceOn > 0.5) { vec4 s = m_source(q); return s.rgb + u_bg * (1.0 - s.a); }\n  vec2 uv = (q - 0.5) * M_asp();\n  return ramp(0.5 + 0.5 * lfbm(uv * 1.5, 3, safeCycles(float(p_turns)), 0.5));\n}\n\n// Mosaic Tide: the flow-warped source is sampled per block and stepped through dithered colour bands, so water and\n// fabric turn into stair-stepped poster pixels.\nvec4 motif(vec2 uv, vec2 fc) {\n  vec2 asp = M_asp();\n  float k = safeCycles(float(p_turns));\n  float cells = float(p_cells);\n  vec2 cuv = (floor(uv * cells) + 0.5) / cells;\n  vec2 w = pf_flow(cuv * p_scale, k);\n  vec2 qq = (cuv + w * p_warp * 0.1) / asp + 0.5;\n  vec3 c = sx(qq);\n  vec2 f = fract(uv * cells);\n  float dither = (h21(floor(uv * cells)) - 0.5) * p_dither;\n  float ec;\n  vec3 s3 = sqrt(max(c, 0.0)) + dither / float(p_bands);\n  vec3 cq = vec3(pf_band(s3.r, float(p_bands), p_soft, ec), pf_band(s3.g, float(p_bands), p_soft, ec), pf_band(s3.b, float(p_bands), p_soft, ec));\n  vec3 col = mix(c, cq * cq, p_amount);\n  vec2 g = smoothstep(vec2(0.0), vec2(p_gap + 0.001), min(f, 1.0 - f));\n  col = mix(u_bg, col, mix(1.0, g.x * g.y, step(0.001, p_gap)));\n  col = pf_finish(col, uv, fc, p_vignette, p_exposure, p_grain);\n  return vec4(max(col, 0.0), 1.0);\n}\n","styles/oil-wash.glsl":"// Source colour at frame-normalised q, or the palette ink marble when no media is attached (thumbnails never blank).\nvec3 sx(vec2 q) {\n  if (u_sourceOn > 0.5) { vec4 s = m_source(q); return s.rgb + u_bg * (1.0 - s.a); }\n  vec2 uv = (q - 0.5) * M_asp();\n  return ramp(0.5 + 0.5 * lfbm(uv * 1.5, 3, safeCycles(float(p_turns)), 0.5));\n}\n\n// Oil Wash: a Kuwahara painter. The warped source is smoothed inside whichever of four quadrants is flattest, so detail\n// melts into brush-like colour fields with crisp edges between them.\nvec4 motif(vec2 uv, vec2 fc) {\n  vec2 q = fc / u_res, asp = M_asp();\n  float k = safeCycles(float(p_turns));\n  vec2 w = pf_flow(uv * p_scale, k);\n  vec2 qq = q + w * p_warp * 0.06 / asp;\n  vec2 px = p_stroke / u_res;\n  vec3 m0 = vec3(0.0), m1 = vec3(0.0), m2 = vec3(0.0), m3 = vec3(0.0);\n  vec3 s0 = vec3(0.0), s1 = vec3(0.0), s2 = vec3(0.0), s3 = vec3(0.0);\n  float n = 0.0;\n  for (int j = 0; j <= 3; j++) {\n    if (j > p_radius) break;\n    for (int i = 0; i <= 3; i++) {\n      if (i > p_radius) break;\n      float fi = float(i), fj = float(j);\n      vec3 a = sx(qq + vec2(-fi, -fj) * px), b = sx(qq + vec2(fi, -fj) * px), c = sx(qq + vec2(-fi, fj) * px), d = sx(qq + vec2(fi, fj) * px);\n      m0 += a; s0 += a * a; m1 += b; s1 += b * b; m2 += c; s2 += c * c; m3 += d; s3 += d * d; n += 1.0;\n    }\n  }\n  m0 /= n; m1 /= n; m2 /= n; m3 /= n;\n  float v0 = dot(max(s0 / n - m0 * m0, 0.0), vec3(1.0)), v1 = dot(max(s1 / n - m1 * m1, 0.0), vec3(1.0));\n  float v2 = dot(max(s2 / n - m2 * m2, 0.0), vec3(1.0)), v3 = dot(max(s3 / n - m3 * m3, 0.0), vec3(1.0));\n  vec3 col = m0; float vm = v0;\n  if (v1 < vm) { vm = v1; col = m1; }\n  if (v2 < vm) { vm = v2; col = m2; }\n  if (v3 < vm) { vm = v3; col = m3; }\n  float L = luma(col);\n  col = mix(vec3(L), col, p_chroma);\n  col += u_ink * smoothstep(0.0, 0.3, vm * 40.0) * p_edge * 0.1;\n  col = pf_finish(col, uv, fc, p_vignette, p_exposure, p_grain);\n  return vec4(max(col, 0.0), 1.0);\n}\n","styles/petal-fold.glsl":"// Source colour at frame-normalised q, or the palette ink marble when no media is attached (thumbnails never blank).\nvec3 sx(vec2 q) {\n  if (u_sourceOn > 0.5) { vec4 s = m_source(q); return s.rgb + u_bg * (1.0 - s.a); }\n  vec2 uv = (q - 0.5) * M_asp();\n  return ramp(0.5 + 0.5 * lfbm(uv * 1.5, 3, safeCycles(float(p_turns)), 0.5));\n}\n\n// Petal Fold: the source is mirror-folded around a centre into N petals, then poured through the flow, so any photo\n// becomes a symmetric bloom.\nvec4 motif(vec2 uv, vec2 fc) {\n  vec2 asp = M_asp();\n  float k = safeCycles(float(p_turns));\n  vec2 p = uv - v_centre();\n  float r = length(p), a = atan(p.y, p.x);\n  float seg = TAU / float(p_petals);\n  a = abs(mod(a + p_spin * 0.1, seg) - seg * 0.5);                  // mirror fold\n  vec2 f = vec2(cos(a), sin(a)) * r;\n  vec2 w = pf_flow(f * p_scale + 0.25 * lc(k, 0.0), k);\n  f += w * p_warp * 0.1;\n  f *= 1.0 + p_zoomIn * (0.35 - r);\n  f += v_pick();\n  vec3 c = sx(f / asp + 0.5);\n  float vein = 1.0 - smoothstep(0.0, 0.01 + aa(), abs(a - 0.0)) ;\n  vein += 1.0 - smoothstep(0.0, 0.01 + aa(), abs(a - seg * 0.5));\n  vec3 col = mix(c, u_bg, vein * p_seam * 0.6);\n  col = pf_finish(col, uv, fc, p_vignette, p_exposure, p_grain);\n  return vec4(max(col, 0.0), 1.0);\n}\n","styles/satin-pour.glsl":"// Source colour at frame-normalised q, or the palette ink marble when no media is attached (thumbnails never blank).\nvec3 sx(vec2 q) {\n  if (u_sourceOn > 0.5) { vec4 s = m_source(q); return s.rgb + u_bg * (1.0 - s.a); }\n  vec2 uv = (q - 0.5) * M_asp();\n  return ramp(0.5 + 0.5 * lfbm(uv * 1.5, 3, safeCycles(float(p_turns)), 0.5));\n}\n\n// Satin Pour: a low-frequency height field refracts the source and is lit with a stretched sheen, like silk or liquid chrome.\nfloat ht(vec2 p, float k) { return 0.75 * ln2(p, k, 0.5) + 0.25 * ln2(p * 2.1 + 7.0, k, 0.5); }\nvec4 motif(vec2 uv, vec2 fc) {\n  vec2 q = fc / u_res, asp = M_asp();\n  float k = safeCycles(float(p_turns));\n  vec2 p = uv * p_scale + 0.3 * lc(k, 0.0);\n  float e = 0.02;\n  float h = ht(p, k);\n  vec2 g = vec2(ht(p + vec2(e, 0.0), k) - ht(p - vec2(e, 0.0), k), ht(p + vec2(0.0, e), k) - ht(p - vec2(0.0, e), k)) / (2.0 * e);\n  vec3 n = normalize(vec3(-g * p_relief, 1.0));\n  vec3 c = sx(q + g * p_refract * 0.05 / asp);\n  vec3 L = normalize(vec3(vec2(cos(radians(p_light)), sin(radians(p_light))) * 0.8, 0.7));\n  float diff = 0.8 + 0.3 * (dot(n, L) - 0.7);\n  vec3 H = normalize(L + vec3(0.0, 0.0, 1.0));\n  float ta = radians(p_light) + 1.5708;\n  vec3 t = vec3(cos(ta), sin(ta), 0.0);                              // anisotropic: highlight stretches along a fixed tangent\n  vec2 ns = n.xy - t.xy * dot(n.xy, t.xy) * 0.8;                       // flatten the normal along the tangent: highlights stretch\n  float spec = pow(sat(dot(normalize(vec3(ns, n.z)), H)), p_gloss);\n  float fres = pow(1.0 - n.z, 2.0);\n  vec3 col = c * diff + u_ink * spec * p_sheen * 0.35 + u_a1 * fres * 0.25 * p_sheen;\n  col = pf_finish(col, uv, fc, p_vignette, p_exposure, p_grain);\n  return vec4(max(col, 0.0), 1.0);\n}\n","styles/streak-melt.glsl":"// Streak Melt: where a looping mask opens, the source is dragged along a direction, split into R/G/B and cut into slabs.\n// No time-slot flicker: slab offsets are stable per slab and breathe with whole-cycle sines.\nvec4 motif(vec2 uv, vec2 fc) {\n  vec2 q = fc / u_res;\n  vec2 asp = M_asp();\n  float k = safeCycles(float(p_turns));\n  float ang = radians(p_angle);\n  vec2 dir = vec2(cos(ang), sin(ang)), nrm = vec2(-dir.y, dir.x);\n  // Coordinates along / across the drag direction.\n  float along = dot(uv, dir), across = dot(uv, nrm);\n  // Optional slabs: quantize the across axis so streaks read as sheared strips.\n  float rows = float(p_slabs);\n  float acr = rows > 0.5 ? (floor(across * rows) + 0.5) / rows : across;\n  float jit = rows > 0.5 ? h11(floor(across * rows) + 3.0) - 0.5 : 0.0;\n\n  float m = 0.5 + 0.5 * ln2(vec2(acr * p_scale, along * 0.35 + jit * 2.0), k, 0.6);\n  float open = smoothstep(p_thresh, p_thresh + 0.28, m);\n  float amt = open * (0.55 + 0.45 * lsin(k, m * 2.0 + jit));\n  vec2 shift = dir * (p_length * (0.35 + 0.65 * amt) * open + jit * p_jitter * 0.3) / asp;\n\n  vec3 fallback = ramp(0.5 + 0.5 * lfbm(vec2(acr * 1.4, along * 0.8), 3, k, 0.5));\n  vec3 acc = vec3(0.0); float wsum = 0.0;\n  float ca = p_split * 0.02 * (0.3 + amt);\n  for (int i = 0; i < 12; i++) {\n    if (i >= p_taps) break;\n    float t = float(i) / max(float(p_taps - 1), 1.0);\n    float wt = pf_tw(float(i), float(p_taps));\n    vec2 o = -shift * (0.25 + 0.75 * t);\n    vec4 sr = m_source(q + o + dir * ca / asp), sg = m_source(q + o), sb = m_source(q + o - dir * ca / asp);\n    vec3 fr = fallback;\n    vec3 c = vec3(sr.r + u_bg.r * (1.0 - sr.a), sg.g + u_bg.g * (1.0 - sg.a), sb.b + u_bg.b * (1.0 - sb.a));\n    acc += mix(fr, c, u_sourceOn) * wt; wsum += wt;\n  }\n  vec3 col = acc / max(wsum, 1e-3);\n  col = pf_poster(col, float(p_bands), p_soft, p_hue, p_mode, p_palMix, p_veins, p_veinW, c_vein());\n  col = pf_finish(col, uv, fc, p_vignette, p_exposure, p_grain);\n  return vec4(max(col, 0.0), 1.0);\n}\n","styles/thin-film.glsl":"// Source colour at frame-normalised q, or the palette ink marble when no media is attached (thumbnails never blank).\nvec3 sx(vec2 q) {\n  if (u_sourceOn > 0.5) { vec4 s = m_source(q); return s.rgb + u_bg * (1.0 - s.a); }\n  vec2 uv = (q - 0.5) * M_asp();\n  return ramp(0.5 + 0.5 * lfbm(uv * 1.5, 3, safeCycles(float(p_turns)), 0.5));\n}\n\n// Thin Film: a liquid warp of the source with iridescent halos where luminance changes fast, like oil film on glass.\nvec4 motif(vec2 uv, vec2 fc) {\n  vec2 q = fc / u_res, asp = M_asp();\n  float k = safeCycles(float(p_turns));\n  vec2 w = pf_flow(uv * p_scale, k);\n  vec2 qq = q + w * p_warp * 0.09 / asp;\n  vec3 c = sx(qq);\n  float L0 = luma(c), acc = 0.0;\n  for (int i = 0; i < 8; i++) {\n    float a = TAU * float(i) / 8.0 + 0.4;\n    acc += luma(sx(qq + vec2(cos(a), sin(a)) * p_radius / asp));\n  }\n  float Lb = acc / 8.0;\n  float edge = (Lb - L0) * p_gain;\n  float film = edge * p_thick + 0.35 * L0 + p_hue + 0.15 * lsin(k, 0.0);\n  vec3 irid = pf_spectrum(film);\n  float m = smoothstep(0.02, 0.4, abs(edge)) * p_amount;\n  vec3 col = mix(c, irid * (0.3 + 1.2 * Lb), m * 0.85) + irid * max(-edge, 0.0) * p_glow;\n  col = pf_finish(col, uv, fc, p_vignette, p_exposure, p_grain);\n  return vec4(max(col, 0.0), 1.0);\n}\n","styles/tide-glint.glsl":"// Source colour at frame-normalised q, or the palette ink marble when no media is attached (thumbnails never blank).\nvec3 sx(vec2 q) {\n  if (u_sourceOn > 0.5) { vec4 s = m_source(q); return s.rgb + u_bg * (1.0 - s.a); }\n  vec2 uv = (q - 0.5) * M_asp();\n  return ramp(0.5 + 0.5 * lfbm(uv * 1.5, 3, safeCycles(float(p_turns)), 0.5));\n}\n\n// Tide Glint: looping ripples refract the source and every highlight throws a four-way glint, like sun on water.\nvec4 motif(vec2 uv, vec2 fc) {\n  vec2 q = fc / u_res, asp = M_asp();\n  float k = safeCycles(float(p_turns));\n  vec2 p = uv * p_scale;\n  vec2 rip = vec2(ln2(p * 1.6, k, 0.6), ln2(p * 1.6 + 23.1, k, 0.6)) * 0.6 + vec2(ln2(p * 3.7 + 4.0, k, 0.45), ln2(p * 3.7 + 11.0, k, 0.45)) * 0.35;\n  vec2 qq = q + rip * p_ripple * 0.04 / asp;\n  vec3 c = sx(qq);\n  vec3 glint = vec3(0.0);\n  for (int d = 0; d < 4; d++) {\n    float a = PI * (float(d) + 0.5) / 4.0 + radians(p_angle);\n    vec2 dir = vec2(cos(a), sin(a));\n    for (int j = 1; j <= 6; j++) {\n      float t = float(j) / 6.0;\n      vec2 o = dir * t * p_length / asp;\n      vec3 s1 = sx(qq + o), s2 = sx(qq - o);\n      float fall = (1.0 - t) * (1.0 - t);\n      glint += (max(s1 - p_thresh, 0.0) + max(s2 - p_thresh, 0.0)) * fall;\n    }\n  }\n  vec3 grade = mix(vec3(1.0), u_a1 * 1.6, p_tint);\n  vec3 col = c * mix(vec3(1.0), u_a0 * 1.5 + 0.2, p_tint * 0.5) + glint * p_glint * 0.12 * grade;\n  col = pf_finish(col, uv, fc, p_vignette, p_exposure, p_grain);\n  return vec4(max(col, 0.0), 1.0);\n}\n","transitions/liquid-cut.glsl":"// Liquid Cut: a flow-warped ink front sweeps from one shot to the next; both shots are pushed through the flow by\n// sin(pi * progress), so progress 0 is exactly `from` and 1 exactly `to`.\nvec4 motif(vec2 uv, vec2 fc) {\n  vec2 q = fc / u_res;\n  vec2 asp = M_asp();\n  float amt = sin(PI * u_progress);\n  vec2 w = vec2(snoise(vec3(uv * p_scale, 1.7)), snoise(vec3(uv * p_scale + 9.3, 4.1)));\n  vec2 d = w * p_warp * 0.12 * amt / asp;\n  vec4 a = g_fromAt(q + d), b = g_toAt(q - d);\n  float n01 = clamp(0.5 + 0.5 * snoise(vec3(uv * p_scale * 0.8 + 3.1, 7.7)), 0.0, 1.0);\n  float soft = max(p_soft, 0.01);\n  float e = u_progress * (1.0 + 2.0 * soft) - soft;\n  float m = smoothstep(n01 - soft, n01 + soft, e);\n  float edge = exp(-pow((e - n01) / (soft * 1.2), 2.0)) * amt;\n  vec4 c = mix(a, b, m);\n  vec3 rim = mix(u_a0, u_ink, 0.4) * edge * p_rim;\n  return vec4(c.rgb + rim, max(c.a, min(1.0, luma(rim))));\n}\n"}}</script>
